services:
  db:
    image: postgres:15-alpine
    container_name: iiitd_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=iiitd_grade_dash
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
